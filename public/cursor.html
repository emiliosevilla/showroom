<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showroom · Cursor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Entry for Cursor's integrated Simple Browser.
      Top-level host embeds the Vite app same-origin so file pickers work via webkitdirectory fallback.
      Open: http://localhost:3000/cursor.html
    -->
    <iframe
      src="/"
      title="Showroom"
      allow="file-system-access *; clipboard-read *; clipboard-write *; fullscreen *"
    ></iframe>
  </body>
</html>
